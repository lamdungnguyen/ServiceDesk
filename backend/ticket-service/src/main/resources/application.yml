server:
  port: 8081

spring:
  application:
    name: ticket-service
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=TicketDB;trustServerCertificate=true;encrypt=true;
    username: sa
    password: StrongPassword123!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# Cấu hình AI Service (sẽ dùng sau)
ai:
  service:
    url: http://localhost:8000

messaging:
  upload-dir: uploads/

auth:
  jwt:
    secret: ${JWT_SECRET:servicedesk-local-dev-secret-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
